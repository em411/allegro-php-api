name: Update API Client

on:
  schedule:
    - cron: '23 * * * *'   # hourly; off the hour since :00 runs are often delayed
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if spec is unchanged'
        type: boolean
        default: false
      bump:
        description: 'Version bump (auto = detect from spec diff; override e.g. for generator upgrades)'
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: write

concurrency:
  group: api-client-update
  cancel-in-progress: false

env:
  REMOTE_API_URL: https://developer.allegro.pl/swagger.yaml
  PHP_VERSION: '8.5'
  TEMP_DIR: .tmp            # keep throwaway files out of project root

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Bootstrap ──────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # needed so the tag action can see history

      # ── Download & check spec (cheap, runs every time) ─
      - name: Download Remote OpenAPI Spec
        run: |
          mkdir -p "$TEMP_DIR"
          curl -fSL --retry 5 --retry-delay 10 --retry-max-time 120 \
            --connect-timeout 15 --max-time 60 \
            -A "GitHubActions-AllegroSDK/1.0 (+https://github.com/${{ github.repository }})" \
            -o "$TEMP_DIR/new_spec.yaml" "$REMOTE_API_URL"

      - name: Check downloaded spec
        run: |
          FILE="$TEMP_DIR/new_spec.yaml"

          # Must be at least 10 KB (a real spec)
          MIN_SIZE=10240
          FILE_SIZE=$(stat --printf='%s' "$FILE")
          if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::Downloaded file is suspiciously small (${FILE_SIZE} bytes)"
            exit 1
          fi

          if ! grep -qE '^(openapi|swagger):' "$FILE" || ! grep -q '^paths:' "$FILE"; then
            echo "::error::Not an OpenAPI/Swagger spec (missing openapi/swagger or paths key)"
            exit 1
          fi
          echo "✅ Valid spec — $(grep -cE '^  /' "$FILE") paths found"

      # ── Compare specs ──────────────────────────────────
      - name: Check for spec changes
        id: spec_check
        run: |
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "⚡ Forced run — skipping diff."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "resources/spec.yaml" ]; then
            OLD=$(sha256sum resources/spec.yaml | awk '{print $1}')
            NEW=$(sha256sum "$TEMP_DIR/new_spec.yaml" | awk '{print $1}')
            if [ "$OLD" = "$NEW" ]; then
              echo "🟢 Spec unchanged — nothing to do."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "### 🟢 Spec Unchanged" >> "$GITHUB_STEP_SUMMARY"
              echo "The remote spec hash matches the committed spec. No update needed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            echo "📄 No existing spec found — treating as initial import."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # ── Everything below runs only when the spec changed ──
      - name: Setup PHP
        if: steps.spec_check.outputs.changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          ini-values: zend.enable_gc=0
          tools: composer, parallel-lint

      - name: Cache Composer packages
        if: steps.spec_check.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Dependencies
        if: steps.spec_check.outputs.changed == 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      # Same YAML parser Jane uses, so if this passes, generation can read it
      - name: Validate spec syntax
        if: steps.spec_check.outputs.changed == 'true'
        run: vendor/bin/yaml-lint "$TEMP_DIR/new_spec.yaml"

      # ── Diff specs ─────────────────────────────────────
      # review: false keeps the specs from being uploaded to oasdiff.com, and
      # github-token: '' stops the action from posting PR comments.
      - name: Diff specs (JSON, for version detection)
        if: steps.spec_check.outputs.changed == 'true' && hashFiles('resources/spec.yaml') != ''
        uses: oasdiff/oasdiff-action/changelog@v0.1.21
        with:
          base: resources/spec.yaml
          revision: ${{ env.TEMP_DIR }}/new_spec.yaml
          format: json
          output-to-file: ${{ env.TEMP_DIR }}/changelog.json
          review: false
          github-token: ''

      - name: Diff specs (text, for release notes)
        if: steps.spec_check.outputs.changed == 'true' && hashFiles('resources/spec.yaml') != ''
        uses: oasdiff/oasdiff-action/changelog@v0.1.21
        with:
          base: resources/spec.yaml
          revision: ${{ env.TEMP_DIR }}/new_spec.yaml
          output-to-file: ${{ env.TEMP_DIR }}/changelog.txt
          review: false
          github-token: ''

      # ── Semantic version detection ─────────────────────
      - name: Detect Semantic Version Bump
        id: versioning
        if: steps.spec_check.outputs.changed == 'true'
        env:
          BUMP_OVERRIDE: ${{ inputs.bump }}   # empty on scheduled runs
        run: |
          BUMP_TYPE="patch"
          RELEASE_NOTES="$TEMP_DIR/release_notes.md"

          # The tag action derives the bump from commit messages (Angular rules)
          # and only falls back to default_bump when none match, so the commit
          # message has to carry the bump: BREAKING CHANGE footer → major,
          # feat → minor, fix → patch.
          write_outputs() {
            if [ -n "$BUMP_OVERRIDE" ] && [ "$BUMP_OVERRIDE" != "auto" ]; then
              echo "✋ Bump manually set: $BUMP_TYPE → $BUMP_OVERRIDE"
              BUMP_TYPE="$BUMP_OVERRIDE"
              printf '\n### ✋ Version bump manually set to **%s**\n' "$BUMP_TYPE" >> "$RELEASE_NOTES"
            fi
            case "$BUMP_TYPE" in
              major) MSG=$'feat: synchronize with remote API spec\n\nBREAKING CHANGE: see the release notes for details' ;;
              minor) MSG='feat: synchronize with remote API spec' ;;
              *)     MSG='fix: synchronize with remote API spec' ;;
            esac
            {
              echo "bump_type=$BUMP_TYPE"
              echo "commit_message<<EOF_COMMIT_MESSAGE"
              echo "$MSG"
              echo "EOF_COMMIT_MESSAGE"
            } >> "$GITHUB_OUTPUT"
          }

          cat <<'EOF' > "$RELEASE_NOTES"
          Automatic update triggered by changes in the remote Allegro API definition.

          EOF

          if [ ! -f "resources/spec.yaml" ]; then
            echo "📄 Initial import — defaulting to **patch**."
            echo "### 📄 Initial Import" >> "$RELEASE_NOTES"
            write_outputs
            exit 0
          fi

          # oasdiff levels: 3 = ERR (breaking), 2 = WARN, 1 = INFO (new endpoints /
          # features). With no changes the action writes plain text instead of
          # JSON, so a failed parse counts as "no changes at that level".
          has_level() {
            jq -e --argjson level "$1" 'type == "array" and any(.[]; .level == $level)' \
              "$TEMP_DIR/changelog.json" >/dev/null 2>&1
          }

          if has_level 3; then
            echo "🚨 Breaking changes detected → MAJOR"
            BUMP_TYPE="major"
            echo "### 🚨 Breaking API Changes" >> "$RELEASE_NOTES"
          elif has_level 1; then
            echo "✨ New features detected → MINOR"
            BUMP_TYPE="minor"
            echo "### ✨ New API Features" >> "$RELEASE_NOTES"
          else
            echo "🐛 Non-breaking fixes → PATCH"
            BUMP_TYPE="patch"
            echo "### 🐛 Non-Breaking Changes" >> "$RELEASE_NOTES"
          fi

          {
            echo '```text'
            cat "$TEMP_DIR/changelog.txt"
            echo '```'
          } >> "$RELEASE_NOTES"

          write_outputs

          # Job summary
          {
            echo "### Version Bump: \`$BUMP_TYPE\`"
            cat "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Generate code ──────────────────────────────────
      - name: Replace spec and generate code
        if: steps.spec_check.outputs.changed == 'true'
        run: |
          cp "$TEMP_DIR/new_spec.yaml" resources/spec.yaml
          vendor/bin/jane-openapi generate --config-file=.jane-openapi.php

      # ── Validate generated code ────────────────────────
      - name: Validate generated code
        if: steps.spec_check.outputs.changed == 'true'
        run: parallel-lint --no-colors -e php generated/

      # ── Commit, tag, release ───────────────────────────
      # Generation takes ~20 min, so main may have moved on (e.g. a merged PR);
      # fast-forward to it so the push isn't rejected. Fails if main changed
      # generated/ or the spec in the meantime, rather than overwriting it.
      - name: Fast-forward to latest main
        if: steps.spec_check.outputs.changed == 'true'
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Commit Changes
        id: auto-commit
        if: steps.spec_check.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.versioning.outputs.commit_message }}
          file_pattern: 'generated/** resources/spec.yaml'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and push tag
        id: tag_version
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag (and read the bump from) the commit just made, not GITHUB_SHA,
          # which is the commit the run started from
          commit_sha: ${{ steps.auto-commit.outputs.commit_hash }}
          default_bump: ${{ steps.versioning.outputs.bump_type }}
          release_branches: main

      - name: Create GitHub Release
        if: steps.auto-commit.outputs.changes_detected == 'true' && steps.tag_version.outputs.new_tag
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: ${{ env.TEMP_DIR }}/release_notes.md

      # ── Cleanup ────────────────────────────────────────
      - name: Cleanup temporary files
        if: always()
        run: rm -rf "$TEMP_DIR"
